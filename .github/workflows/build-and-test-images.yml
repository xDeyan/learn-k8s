name: Build and test images

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-and-test-images.yml'
      - 'product-service/**'
      - 'pricing-service/**'
      - 'pom.xml'

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Build
        run: mvn -B -ntp compile

      - name: Test
        run: mvn -B -ntp test

      - name: Publish unit test results to pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('**/target/surefire-reports/TEST-*.xml') != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          comment_title: Unit test results
          files: '**/target/surefire-reports/TEST-*.xml'
          comment_mode: always
          check_run: false

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Integration Test
        run: mvn -B -ntp verify

      - name: Publish integration test results to pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('**/target/failsafe-reports/TEST-*.xml') != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          comment_title: Integration test results
          files: '**/target/failsafe-reports/TEST-*.xml'
          comment_mode: always
          check_run: false

      - name: Upload packaged service artifacts
        if: github.event_name == 'push' && success()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-service-artifacts
          path: |
            product-service/target/*.jar*
            pricing-service/target/*.jar*
          if-no-files-found: error

  build-images:
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - product-service
          - pricing-service

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Download packaged service artifacts
        uses: actions/download-artifact@v5
        with:
          name: packaged-service-artifacts
          path: .

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore buildpacks cache
        id: buildpacks-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/buildpack-cache/${{ matrix.service }}
          key: buildpacks-${{ matrix.service }}-${{ runner.os }}-jammy-tiny-java27-${{ hashFiles('pom.xml', format('{0}/pom.xml', matrix.service)) }}
          restore-keys: |
            buildpacks-${{ matrix.service }}-${{ runner.os }}-jammy-tiny-java27-

      - name: Prepare buildpacks cache directory
        run: mkdir -p "${RUNNER_TEMP}/buildpack-cache/${{ matrix.service }}"

      - name: Package OCI image
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          BUILDPACK_CACHE_DIR: ${{ runner.temp }}/buildpack-cache
        run: |
          IMAGE_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"

          mvn -B -ntp \
            -DskipTests \
            -Dghcr.owner="${GHCR_OWNER,,}" \
            -DimageName="${{ matrix.service }}:${IMAGE_VERSION}-${{ github.run_number }}" \
            -Pdev,ghcr \
            -pl ${{ matrix.service }} \
            spring-boot:build-image-no-fork

      - name: Save buildpacks cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/buildpack-cache/${{ matrix.service }}
          key: ${{ steps.buildpacks-cache.outputs.cache-primary-key }}
