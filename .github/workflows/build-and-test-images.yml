name: Build and test images

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-and-test-images.yml'
      - 'product-service/**'
      - 'pricing-service/**'
      - 'pom.xml'

permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 27
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '27'
          cache: maven

      - name: Build
        run: mvn -B -ntp compile

      - name: Test
        run: mvn -B -ntp test

      - name: Publish unit test results to pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('**/target/surefire-reports/TEST-*.xml') != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          comment_title: Unit test results
          files: '**/target/surefire-reports/TEST-*.xml'
          comment_mode: always
          check_run: false

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Integration Test
        run: mvn -B -ntp verify

      - name: Publish integration test results to pull request
        if: always() && github.event_name == 'pull_request' && hashFiles('**/target/failsafe-reports/TEST-*.xml') != ''
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          comment_title: Integration test results
          files: '**/target/failsafe-reports/TEST-*.xml'
          comment_mode: always
          check_run: false

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package OCI images
        if: github.event_name == 'push'
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          IMAGE_VERSION="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"

          mvn -B -ntp \
            -DskipTests \
            -Dghcr.owner="${GHCR_OWNER,,}" \
            -DimageName="product-service:${IMAGE_VERSION}-${{ github.run_number }}" \
            -Pdev,ghcr \
            -pl product-service \
            spring-boot:build-image-no-fork

          mvn -B -ntp \
            -DskipTests \
            -Dghcr.owner="${GHCR_OWNER,,}" \
            -DimageName="pricing-service:${IMAGE_VERSION}-${{ github.run_number }}" \
            -Pdev,ghcr \
            -pl pricing-service \
            spring-boot:build-image-no-fork
