name: Build and test images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-and-test-images.yml'
      - 'product-service/**'
      - 'pricing-service/**'
      - 'pom.xml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build
        run: mvn -B -ntp compile

      - name: Test
        run: mvn -B -ntp test

      - name: Package
        run: mvn -B -ntp package -DskipTests

      - name: Integration Test
        run: mvn -B -ntp verify

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package OCI images
        if: github.event_name == 'push'
        run: mvn -B -ntp -DskipTests -Dghcr.owner=${GITHUB_REPOSITORY_OWNER,,} -Pdev,ghcr -pl product-service,pricing-service spring-boot:build-image-no-fork
