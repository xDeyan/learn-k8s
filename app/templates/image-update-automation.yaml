apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: app-images
  namespace: flux-system
spec:
  interval: 10m
  policyChangeDelay: 2m
  sourceRef:
    kind: GitRepository
    name: learn-k8s
  git:
    checkout:
      ref:
        branch: main
    push:
      branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        Update application images

        {{ "{{ .Changed.Summary }}" }}
  update:
    strategy: Setters
    path: ./app
