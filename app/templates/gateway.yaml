apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: app-gateway
  labels:
    app: app-gateway
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: app-gateway-options
  listeners:
    - name: http
      port: 8080
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-gateway-options
data:
  service: |
    spec:
      type: ClusterIP

{{- if eq .Values.global.deploymentMode "local" }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: public-to-app-gateway
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: public
  to:
    - group: ""
      kind: Service
      name: app-gateway-istio
{{- end }}
