apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app
  namespace: flux-system
spec:
  interval: 5m
  releaseName: app
  targetNamespace: default
  install:
    createNamespace: true
  chart:
    spec:
      chart: ./app
      sourceRef:
        kind: GitRepository
        name: learn-k8s
        namespace: flux-system
      interval: 1m
