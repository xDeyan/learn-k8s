apiVersion: skaffold/v4beta12
kind: Config
metadata:
  name: learn-k-s

build:
  artifacts:
    - image: pricing-service
      custom:
        buildCommand: mvn spring-boot:build-image -f pricing-service/pom.xml -P dev -DimageName=%IMAGE% -DskipTests -X
#    - image: product-service
#      custom:
#        buildCommand: mvn spring-boot:build-image -f product-service/pom.xml -P dev -DimageName=%IMAGE% -DskipTests -X


manifests:
  helm:
    releases:
      - name: pricing-service
        chartPath: ./app
        skipBuildDependencies: true
#        dependsOn:
#          - localstack
#        https://skaffold.dev/docs/deployers/helm/#image-configuration
        setValueTemplates:
          pricing-service.image.repository: "{{.IMAGE_REPO_pricing_service}}"
          pricing-service.image.tag: "{{.IMAGE_TAG_pricing_service}}@{{.IMAGE_DIGEST_pricing_service}}"

  hooks:
    before:
      - host:
          command: [ "terraform", "-chdir=terraform", "init" ]
      - host:
          #          tf -chdir=terraform apply \
          #               -target=module.infra.module.kafka.module.kafka_operator.module.kafka_crds \
          #               -target=module.monitoring.module.otel_crds \
          #               -auto-approve
          command:
            - terraform
            - -chdir=terraform
            - apply
            - -target=module.infra.module.kafka.module.kafka_operator.module.kafka_crds
            - -target=module.monitoring.module.otel_crds
            - -auto-approve
      - host:
          #           tf -chdir=terraform apply -auto-approve
          command: [ "terraform", "-chdir=terraform", "apply", "-auto-approve" ]


