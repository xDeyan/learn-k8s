apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.10.x"
    registry: "ghcr.io/fluxcd"
  cluster:
    type: kubernetes
    size: small
  sync:
    kind: GitRepository
    url: https://github.com/xDeyan/learn-k8s.git
    ref: refs/heads/main
    path: clusters/minikube/flux-system
    interval: 1m
  components:
    - source-controller
    - helm-controller
    - notification-controller
    - image-reflector-controller
    - image-automation-controller
