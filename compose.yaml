services:
  postgres:
    image: "postgres:latest"
    environment:
      - POSTGRES_DB=product
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    labels:
      org.springframework.boot.jdbc.parameters: reWriteBatchedInserts=true

    ports:
      - "5432:5432"

