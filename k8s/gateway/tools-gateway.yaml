apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tools-gateway
  namespace: tools
  labels:
    app: tools-gateway
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: tools-gateway-options

  listeners:
    - name: http
      port: 9000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tools-gateway-options
  namespace: tools
data:
  service: |
    spec:
      type: ClusterIP

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafka-ui-route
  namespace: tools
spec:
  parentRefs:
    - name: tools-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /kafka-ui
      backendRefs:
        - namespace: tools
          name: kafbat-ui-kafka-ui
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: floci-ui-route
  namespace: tools
spec:
  parentRefs:
    - name: tools-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /floci-ui
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: floci-ui
          port: 80

---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: default-to-tools-gateway
  namespace: tools
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: public
  to:
    - group: ""
      kind: Service
      name: tools-gateway-istio
