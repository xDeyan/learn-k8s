apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tools-gateway
  namespace: tools
  labels:
    app: tools-gateway
spec:
  gatewayClassName: istio

  listeners:
    - name: http
      port: 9000
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kafka-ui-route
  namespace: tools
spec:
  parentRefs:
    - name: tools-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /kafka-ui
      backendRefs:
        - namespace: tools
          name: kafbat-ui-kafka-ui
          port: 80
