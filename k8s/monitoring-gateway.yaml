apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: monitoring-gateway
  namespace: monitoring
  labels:
    app: monitoring-gateway
spec:
  gatewayClassName: istio

  listeners:
    - name: http
      port: 9999
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
    - name: monitoring-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
#      filters:
#        - type: URLRewrite
#          urlRewrite:
#            path:
#              type: ReplacePrefixMatch
#              replacePrefixMatch: '/'
      backendRefs:
        - namespace: monitoring
          name: grafana
          port: 80
#    - matches:
#        - path:
#            type: PathPrefix
#            value: /public
#      backendRefs:
#        - name: grafana
#          port: 80

